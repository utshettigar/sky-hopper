name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore skyhopper.jks -keyalg RSA -keysize 2048 -validity 10000 -alias skyhopperkey -storepass SkyHopper@123 -keypass SkyHopper@123 -dname "CN=Sky Hopper, OU=Utsav Gaming Studio, O=Utsav Gaming Studio, L=City, S=State, C=IN"

      - name: Encode to base64
        run: base64 -w 0 skyhopper.jks > skyhopper_base64.txt

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            skyhopper.jks
            skyhopper_base64.txt
